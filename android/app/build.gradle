plugins { id 'com.android.application' }
def workspace = rootProject.projectDir.parentFile
def productAssets = new File(workspace, 'tmp/android-product-017/assets')
def telegramAssets = productAssets
layout.buildDirectory = new File(workspace, 'tmp/android-product-017/normal-app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId providers.gradleProperty('qaApplicationId').getOrElse('dev.shiye.app'); minSdk 26; targetSdk 35; versionCode 19; versionName '0.17.0-product-preview' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main { assets.srcDirs = [productAssets] } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('syncEditorAssets', Sync) {
    from(workspace) {
        include 'public/editor/rich-document-editor.js', 'public/editor/rich-body-adapter.js',
          'public/shared/rich-document.js', 'public/shared/limits.js', 'public/shared/date-time-edit.js',
          'public/core/clipboard-files.js', 'public/vendor/rich-editor.js', 'public/vendor/RICH-EDITOR-LICENSES.txt', 'public/styles/rich-quick-editor.css',
          'public/features/editor-input.js', 'public/editor/rich-date-time.js', 'public/shared/time-zone.js',
          'public/shared/message-units.js', 'public/shared/legacy-time-segments.js',
          'public/shared/diary-paragraph-messages.js', 'public/shared/content-preparation.js',
          'public/shared/rich-document-renderer.js'
    }
    into(new File(workspace, 'tmp/android-dual-prototype/editor-assets'))
}
// syncEditorAssets remains a historical manual task; product builds use a frozen asset stage.
tasks.register('verifyTelegramAdapter') {
    doLast {
        ['android-chat.js', 'android-chat.css', 'android-network-guard.js', 'android-stickers.js',
         'android-sticker-transport.js', 'android-sticker-suggestions.js', 'android-sticker-suggestions.css',
         'android-sticker-panel.js', 'android-sticker-panel.css', 'android-qq-skin.js',
         'android-qq-skin.css', 'android-qq-gestures.js'].each { name ->
            def source = new File(workspace, "android/telegram-adapter/${name}")
            def packaged = new File(telegramAssets, "telegram/${name}")
            if (!packaged.isFile() || !java.util.Arrays.equals(source.bytes, packaged.bytes)) {
                throw new GradleException('Telegram适配资产缺失或已过期，请先按android/README.md生成本轮资产。')
            }
        }
        def attachmentModule = new File(telegramAssets, 'telegram/assets/useConnectionStatus-Dy1kHT8L.js')
        if (!attachmentModule.isFile() || !attachmentModule.getText('UTF-8').contains('em as shiyePrepareAttachment') ||
            !attachmentModule.getText('UTF-8').contains('tm as shiyePrepareAttachmentsToSend')) {
            throw new GradleException('表情原件发送桥缺失，请完整构建Telegram资产，不能只运行adapter-only。')
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyTelegramAdapter') }
tasks.register('verifyProductContent') {
    doLast {
        def record = new groovy.json.JsonSlurper().parse(new File(workspace, 'outputs/2026-10-18-android-product-017/content-stage-manifest.json'))
        def module = new File(productAssets, record.module.substring(1))
        if (java.security.MessageDigest.getInstance('SHA-256').digest(module.bytes).encodeHex().toString() != record.sha256) throw new GradleException('Product module stale; run node android/tools/stage-product-preview.mjs')
        record.sources.each { name, sha -> if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(workspace, name).bytes).encodeHex().toString() != sha) throw new GradleException('Shared product source changed; restage and retest') }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyProductContent') }
