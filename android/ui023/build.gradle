plugins { id 'com.android.application' version '8.13.2' }

def workspace = rootProject.projectDir.parentFile.parentFile
def stage = new File(workspace, 'tmp/android-chat-ui023/stage')
layout.buildDirectory = new File(workspace, 'tmp/android-chat-ui023/app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'dev.shiye.uiqa'; minSdk 26; targetSdk 35; versionCode 25; versionName '0.23.0-ui-localqa' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile new File(stage, 'native/AndroidManifest.xml')
        java.srcDirs = [new File(stage, 'native/java')]
        res.srcDirs = [new File(stage, 'native/res')]
        assets.srcDirs = [new File(stage, 'assets')]
    } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('verifyUiStage') {
    doLast {
        def receipt = new groovy.json.JsonSlurper().parse(new File(workspace, 'outputs/2026-10-19-android-ui023/stage-manifest.json'))
        receipt.sources.each { name, sha -> if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(workspace,name).bytes).encodeHex().toString()!=sha) throw new GradleException('UI source changed; restage: '+name) }
        receipt.stageHashes.each { name, sha -> if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(stage,name).bytes).encodeHex().toString()!=sha) throw new GradleException('Frozen stage changed: '+name) }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyUiStage') }
