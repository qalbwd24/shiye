plugins { id 'com.android.application' version '8.13.2' }
def workspace = rootProject.projectDir.parentFile.parentFile
def stage = new File(workspace, 'tmp/android-qq-018')
layout.buildDirectory = new File(stage, providers.gradleProperty('qaApplicationId').isPresent() ? 'qa-app-build' : 'app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId providers.gradleProperty('qaApplicationId').getOrElse('dev.shiye.app'); minSdk 26; targetSdk 35; versionCode 20; versionName '0.18.0-qq-rebuild' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile new File(stage, 'native/AndroidManifest.xml')
        java.srcDirs = [new File(stage, 'native/java')]
        res.srcDirs = [new File(stage, 'native/res')]
        assets.srcDirs = [new File(stage, 'assets')]
    } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('verifyQQRebuildStage') {
    doLast {
        def receipt = new groovy.json.JsonSlurper().parse(new File(workspace, 'outputs/2026-10-18-android-qq-018/stage-manifest.json'))
        receipt.ownedSources.each { name, sha ->
            if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(workspace,name).bytes).encodeHex().toString()!=sha) throw new GradleException('QQ source changed; restage and retest: '+name)
        }
        receipt.nativeFinal.each { name, sha ->
            if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(stage,'native/'+name).bytes).encodeHex().toString()!=sha) throw new GradleException('Native stage changed: '+name)
        }
        receipt.stageHashes.each { name, sha ->
            if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(stage,'assets/telegram/'+name).bytes).encodeHex().toString()!=sha) throw new GradleException('QQ asset changed: '+name)
        }
        receipt.patchedAssets.each { name, sha ->
            if (java.security.MessageDigest.getInstance('SHA-256').digest(new File(stage,'assets/'+name).bytes).encodeHex().toString()!=sha) throw new GradleException('Owned adapter asset changed: '+name)
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyQQRebuildStage') }
