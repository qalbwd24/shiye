plugins { id 'com.android.application' version '8.13.2' }
def workspace = rootProject.projectDir.parentFile.parentFile
def stage = new File(workspace, 'tmp/android-qq-016')
layout.buildDirectory = new File(stage, 'app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId providers.gradleProperty('qaApplicationId').getOrElse('dev.shiye.app'); minSdk 26; targetSdk 35; versionCode 18; versionName '0.16.0-qq-skin' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile new File(stage, 'source14/AndroidManifest.xml')
        java.srcDirs = [new File(stage, 'source14/java')]
        res.srcDirs = [new File(stage, 'source14/res')]
        assets.srcDirs = [new File(stage, 'assets14')]
    } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('verifySkinStage') {
    doLast {
        def receipt = new groovy.json.JsonSlurper().parse(new File(workspace, 'outputs/2026-10-18-android-qq-016/skin-stage-manifest.json'))
        receipt.ownedOverlay.each { name, sha ->
            def source = new File(workspace, "android/telegram-adapter/${name}")
            def asset = new File(stage, "assets14/telegram/${name}")
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(asset.bytes).encodeHex().toString()
            if (!java.util.Arrays.equals(source.bytes, asset.bytes) || actual != sha) throw new GradleException('Skin stage is stale: run python android/tools/stage-qq-skin.py')
        }
        receipt.native.each { name, sha ->
            def source = new File(stage, "source14/${name}")
            if (java.security.MessageDigest.getInstance('SHA-256').digest(source.bytes).encodeHex().toString() != sha) throw new GradleException('Frozen 0.14 native source changed')
        }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifySkinStage') }
