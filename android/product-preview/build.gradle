plugins { id 'com.android.application' version '8.13.2' }
def workspace=rootProject.projectDir.parentFile.parentFile
layout.buildDirectory=new File(workspace,'tmp/android-product-017/app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId providers.gradleProperty('qaApplicationId').getOrElse('dev.shiye.productqa'); minSdk 26; targetSdk 35; versionCode 19; versionName '0.17.0-product-preview'; testInstrumentationRunner 'dev.shiye.app.ProductPageLifecycleRunner' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile new File(workspace,'android/app/src/main/AndroidManifest.xml')
        java.srcDirs=[new File(workspace,'android/app/src/main/java')]
        res.srcDirs=[new File(workspace,'android/app/src/main/res')]
        assets.srcDirs=[new File(workspace,'tmp/android-product-017/assets')]
    } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('verifyProductModule') {
    doLast {
        def record=new groovy.json.JsonSlurper().parse(new File(workspace,'outputs/2026-10-18-android-product-017/content-stage-manifest.json'))
        def module=new File(workspace,'tmp/android-product-017/assets'+record.module)
        if(java.security.MessageDigest.getInstance('SHA-256').digest(module.bytes).encodeHex().toString()!=record.sha256)throw new GradleException('Product content stage is stale')
        record.sources.each { name,sha -> if(java.security.MessageDigest.getInstance('SHA-256').digest(new File(workspace,name).bytes).encodeHex().toString()!=sha)throw new GradleException('Shared product source changed; restage and retest') }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyProductModule') }
