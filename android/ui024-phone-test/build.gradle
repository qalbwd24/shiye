plugins { id 'com.android.application' version '8.13.2' }

def workspace = rootProject.projectDir.parentFile.parentFile
def stage = new File(workspace, 'tmp/android-ui024-build/stage')
def receiptFile = new File(workspace, 'outputs/2026-10-19-android-ui024/stage-manifest.json')
layout.buildDirectory = new File(workspace, 'tmp/android-ui024-phone-test/app-build')
android {
    namespace 'dev.shiye.app'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'dev.shiye.app'; minSdk 26; targetSdk 35; versionCode 26; versionName '0.24.0-ui-test' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets { main {
        manifest.srcFile new File(stage, 'native/AndroidManifest.xml')
        java.srcDirs = [new File(stage, 'native/java')]
        res.srcDirs = [new File(stage, 'native/res')]
        assets.srcDirs = [new File(stage, 'assets')]
    } }
    signingConfigs { debug { storeFile file('D:/codex-tools/android-state/keys/shiye-prototype-debug.jks'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
}
tasks.register('verifyUiStage') {
    doLast {
        def digest = { file -> java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString() }
        if (digest(receiptFile) != '75ddb05a986d25f8377d38032582aa62122a1b261102405da38b844cd8f078e7')
            throw new GradleException('UI024 installed stage manifest changed')
        def receipt = new groovy.json.JsonSlurper().parse(receiptFile)
        if (receipt.stageFileCount != receipt.stageHashes.size()) throw new GradleException('Frozen stage count differs')
        def actual = [] as Set
        stage.eachFileRecurse(groovy.io.FileType.FILES) { file -> actual.add(stage.toPath().relativize(file.toPath()).toString().replace('\\', '/')) }
        if (actual != (receipt.stageHashes.keySet() as Set)) throw new GradleException('Frozen stage file set changed')
        receipt.stageHashes.each { name, sha -> if (digest(new File(stage,name)) != sha) throw new GradleException('Frozen stage changed: '+name) }
    }
}
tasks.named('preBuild').configure { dependsOn tasks.named('verifyUiStage') }
