<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>拾页 · 日记卡片</title>
    <link rel="stylesheet" href="/components/diary-card.css" />
    <script type="module" src="/components/diary-card.js"></script>
  </head>
  <body>
    <main class="card" aria-busy="true">
      <header>
        <a class="brand" href="/" target="_blank" rel="noopener">拾页</a>
        <span class="subtitle">把一段日子，放在眼前</span>
      </header>
      <nav aria-label="日记模式">
        <button type="button" data-mode="recent" aria-pressed="true">最近</button>
        <button type="button" data-mode="random" aria-pressed="false">随机</button>
        <button type="button" data-mode="anniversary" aria-pressed="false">往日此时</button>
      </nav>
      <p id="status" role="status" aria-live="polite">正在翻开日记…</p>
      <a id="unlock" href="/" target="_blank" rel="noopener" hidden>打开主应用解锁</a>
      <article id="entry" hidden>
        <p id="metadata" class="metadata"></p>
        <h1 id="title"></h1>
        <div id="content" class="content"></div>
        <figure id="picture" hidden><img id="image" alt="日记附图" /></figure>
      </article>
      <footer>
        <button id="pin" type="button" disabled aria-pressed="false">置顶</button>
        <div class="actions">
          <button id="refresh" type="button">刷新</button>
          <button id="next" class="primary" type="button" disabled>下一篇</button>
        </div>
      </footer>
    </main>
  </body>
</html>
